name: Build (RDMA)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with -tags=rdma against minio-cpp (${{ matrix.config.arch }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-latest,    arch: "amd64" }
        - { os: ubuntu-24.04-arm, arch: "arm64" }

    steps:
    - name: Checkout minio-go
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: "minio-go"

    - name: Checkout minio-cpp
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: minio/minio-cpp
        # Pinned to a commit, like vcpkg and the actions above: this job copies
        # vendor/s3rdma out of the checkout and installs what it builds, so a
        # floating ref makes the build race whatever landed there. It already
        # did -- a run started before minio-cpp vendored libs3rdma and failed on
        # the missing directory. A tag would still leave that open, since a tag
        # can be moved after review. Bump this when picking up a minio-cpp fix.
        ref: 78e1db407d97bf5fc643858d9f4f482bff069696 # tag v1.0.0, first release carrying miniocpp_client_new_tls as libminio
        persist-credentials: false
        path: "minio-cpp"

    - name: Checkout vcpkg
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: microsoft/vcpkg
        # Pinned: vcpkg master requires a newer CMake than the arm64
        # runner image ships (scripts use string(JSON ... STRING_ENCODE)
        # since microsoft/vcpkg@5397c5c9f), which fails every arm64 run.
        ref: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # tag 2026.06.24
        persist-credentials: false
        path: "vcpkg"

    - name: Install system dependencies
      run: |
        # The runner image ships third-party apt lists -- chrome, microsoft --
        # that nothing here installs from, and whose indexes intermittently fail
        # their hash check and take the job down with them. Drop those lists and
        # retry once; the install below is the real gate, and still fails loudly
        # if the index is genuinely unusable.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                   /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get -qy update || sudo apt-get -qy update || true
        sudo apt-get -qy install cmake libibverbs-dev

    - name: Identify the native dependency cache
      id: native-cache
      env:
        MATRIX_ARCH: ${{ matrix.config.arch }}
      run: |
        mkdir -p "$RUNNER_TEMP/vcpkg-archives"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-archives" >> "$GITHUB_ENV"
        # vcpkg also checks each package ABI. Keep the outer cache specific to
        # the image, compiler, pinned sources and the build options we use.
        cache_identity=$( {
          printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" "$MATRIX_ARCH"
          c++ --version
          cmake --version
          dpkg-query -W -f='${Package}=${Version}\n' libibverbs-dev libnl-3-dev libnl-route-3-dev
          git -C minio-cpp rev-parse HEAD
          git -C vcpkg rev-parse HEAD
          printf '%s\n' 'Release;BUILD_SHARED_LIBS=ON;MINIO_CPP_ENABLE_RDMA=ON'
        } | sha256sum | cut -d ' ' -f 1)
        echo "identity=$cache_identity" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg binary packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/vcpkg-archives
        key: sdk-vcpkg-v1-${{ steps.native-cache.outputs.identity }}-${{ hashFiles('minio-cpp/vcpkg.json', 'minio-cpp/vcpkg-configuration.json', 'minio-cpp/CMakeLists.txt') }}

    - name: Build and install libminiocpp.so with RDMA
      shell: bash
      env:
        MATRIX_ARCH: ${{ matrix.config.arch }}
      run: |
        ./vcpkg/bootstrap-vcpkg.sh
        cd minio-cpp
        ../vcpkg/vcpkg install
        cmake . -B ./build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DMINIO_CPP_ENABLE_RDMA:BOOL=ON
        cmake --build ./build --config Release -j 4
        sudo cmake --install ./build
        case "$MATRIX_ARCH" in
          amd64) s3rdma_arch=x86_64 ;;
          arm64) s3rdma_arch=aarch64 ;;
          *) echo "unsupported architecture: $MATRIX_ARCH" >&2; exit 1 ;;
        esac
        sudo cp -P "vendor/s3rdma/lib/${s3rdma_arch}"/* /usr/local/lib/
        sudo ldconfig

    - uses: ./minio-go/.github/actions/setup-go-ci
      with:
        purpose: rdma
        cache-salt: ${{ steps.native-cache.outputs.identity }}
        module-directory: minio-go
        dependency-files: |
          minio-go/go.mod
          minio-go/go.sum

    - name: Build minio-go with -tags=rdma
      working-directory: minio-go
      run: |
        go build -tags=rdma ./...
        go build -tags=rdma -o /tmp/rdma-test ./cmd/rdma-test

    # The buffer-size guards run before any C call, so they are testable on a
    # runner with no RDMA device. Without this step nothing under -tags=rdma is
    # ever executed, only compiled.
    - name: Test minio-go with -tags=rdma
      working-directory: minio-go
      run: go test -tags=rdma -count=1 -run 'RDMA' -v .
