name: Build (Windows)

on:
  pull_request:

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [1.27.2]
        os: [windows-latest]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out the reviewed OtterIO server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soulteary/otterio
          ref: 4022b784cbb2e1d778411e8385f1e885d0c14216
          path: .ci-otterio
          persist-credentials: false
      - name: Build OtterIO
        shell: pwsh
        working-directory: .ci-otterio
        run: |
          go build -o "$env:RUNNER_TEMP/otterio.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run local and OtterIO core tests
        shell: pwsh
        env:
          OTTERIO_ROOT_USER: sdk-ci-user
          OTTERIO_ROOT_PASSWORD: sdk-ci-disposable-password
          ACCESS_KEY: sdk-ci-user
          SECRET_KEY: sdk-ci-disposable-password
          ENABLE_HTTPS: "0"
        run: |
          go test -short -race ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $server = Start-Process -PassThru -NoNewWindow -FilePath "$env:RUNNER_TEMP/otterio.exe" -ArgumentList "server", "--address", "127.0.0.1:9000", "$env:RUNNER_TEMP/sdk-data"
          try {
            $ready = $false
            foreach ($i in 1..60) {
              if ($server.HasExited) { throw "OtterIO exited before becoming ready" }
              try {
                Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:9000/otterio/health/ready | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "OtterIO did not become ready within 60 seconds" }
            $env:SERVER_ENDPOINT = "127.0.0.1:9000"
            go test -race -count=1 -run '^(TestGetObjectCore|TestGetObjectContentEncoding|TestGetBucketPolicy|TestCoreCopyObject|TestCoreCopyObjectPart|TestCorePutObject|TestCoreGetObjectMetadata|TestCoreMultipartUpload)$' .
            if ($LASTEXITCODE -ne 0) { throw "Core tests failed with exit code $LASTEXITCODE" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id }
          }
