name: Build (Linux)

on:
  pull_request:

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Lint and example compilation do not use the running S3 server.
  checks:
    name: Lint and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-ci
        id: go
        with:
          purpose: checks
          dependency-files: |
            go.mod
            go.sum
            examples/s3/go.mod
            examples/s3/go.sum
            examples/minio/go.mod
            examples/minio/go.sum
      - name: Cache pinned linter binary
        id: linter
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sdk-lint-bin
          key: sdk-linter-v1-${{ steps.go.outputs.identity }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build the linter pinned in go.mod
        if: steps.linter.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-lint-bin"
          go build -o "$RUNNER_TEMP/sdk-lint-bin/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: Lint
        run: make lint GOLANGCI_LINT="$RUNNER_TEMP/sdk-lint-bin/golangci-lint"
      - name: Build all examples
        run: make examples

  integration:
    name: OtterIO core integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-ci
        with:
          purpose: otterio-integration
      - name: Check out the reviewed OtterIO server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soulteary/otterio
          ref: 4022b784cbb2e1d778411e8385f1e885d0c14216
          path: .ci-otterio
          persist-credentials: false
      - name: Build OtterIO
        working-directory: .ci-otterio
        run: go build -o "$RUNNER_TEMP/otterio" .
      - name: Run local and OtterIO core tests
        env:
          OTTERIO_ROOT_USER: sdk-ci-user
          OTTERIO_ROOT_PASSWORD: sdk-ci-disposable-password
          ACCESS_KEY: sdk-ci-user
          SECRET_KEY: sdk-ci-disposable-password
          ENABLE_HTTPS: "0"
        run: |
          go test -short -race ./...
          "$RUNNER_TEMP/otterio" server --address 127.0.0.1:9000 "$RUNNER_TEMP/sdk-data" >"$RUNNER_TEMP/otterio.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/otterio/health/ready >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/otterio.log"; exit 1; fi
          SERVER_ENDPOINT=127.0.0.1:9000 go test -race -count=1 -run '^(TestGetObjectCore|TestGetObjectContentEncoding|TestGetBucketPolicy|TestCoreCopyObject|TestCoreCopyObjectPart|TestCorePutObject|TestCoreGetObjectMetadata|TestCoreMultipartUpload)$' .

  # Preserve the existing required-check name and require both parallel jobs.
  build:
    name: Test on Go 1.27.2 and ubuntu-latest
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, examples, race and OtterIO core tests
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$INTEGRATION_RESULT" = success
