name: Build (Linux)

on:
  pull_request:

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Lint and example compilation do not use the running S3 server.
  checks:
    name: Lint and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-ci
        id: go
        with:
          purpose: checks
          dependency-files: |
            go.mod
            go.sum
            examples/s3/go.mod
            examples/s3/go.sum
            examples/minio/go.mod
            examples/minio/go.sum
      - name: Cache pinned linter binary
        id: linter
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sdk-lint-bin
          key: sdk-linter-v1-${{ steps.go.outputs.identity }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build the linter pinned in go.mod
        if: steps.linter.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-lint-bin"
          go build -o "$RUNNER_TEMP/sdk-lint-bin/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: Lint
        run: make lint GOLANGCI_LINT="$RUNNER_TEMP/sdk-lint-bin/golangci-lint"
      - name: Build all examples
        run: make examples

  integration:
    name: Race and functional tests on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [1.27.2]
        os: [ubuntu-latest]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-ci
        with:
          purpose: integration

      - name: Build on ${{ matrix.os }}
        env:
          MINT_MODE: full
          SERVER_ENDPOINT: localhost:9000
          ACCESS_KEY: minioadmin
          SECRET_KEY: minioadmin
          ENABLE_HTTPS: 1
          MINIO_KMS_SECRET_KEY: my-minio-key:OSMM+vkKUTCvQs9YL/CVMIMt43HFhkUpqJxTmGl6rYw=
          SSL_CERT_FILE: /tmp/certs-dir/public.crt
          MINIO_CI_CD: true
          MINT_NO_FULL_OBJECT: true
        run: |
          mkdir -p /tmp/certs-dir
          cp testcerts/* /tmp/certs-dir
          # Test against the AIStor :edge-daily image so the latest AIStor APIs
          # (object annotations) and checksum algorithms (xxhash3/xxhash128,
          # sha512, md5) are available to the functional tests.
          docker pull quay.io/minio/aistor/minio:edge-daily
          # Free-tier AIStor license so the server allows writes (without a
          # license the server boots read-only). This is a public FREE-plan
          # license, not a secret.
          MINIO_LICENSE="eyJhbGciOiJFUzM4NCIsInR5cCI6IkpXVCJ9.eyJhaWQiOjAsImNhcCI6MCwiaWF0IjoxLjc4MDAzMTY0NTUyMzA5ODM1OGU5LCJpc3MiOiJzdWJuZXRAbWluLmlvIiwibGlkIjoiYjNhYTliNGQtOTUxYy00MjIzLTgyMmEtZGY2NjE5MDNjOWFkIiwibm9kZXMiOjEsIm9yZyI6IiIsInBsYW4iOiJGUkVFIiwicHJvZHVjdCI6IkFJU3RvciIsInN1YiI6ImRldkBtaW5pby5pbyIsInRyaWFsIjpmYWxzZX0.Aq0kaFgd5SMHYEK7fIYzPsU4xlS119sj-BSyftCDpmtHIbW6KNFXGA9nbKPc17ZXKgcQgUoaPncsq30EOy7PyH-lp3LPpy3rPoD7ptJHI2v0jqpvlnP0cVGK0Yuw3vib"
          docker rm -f aistor >/dev/null 2>&1 || true
          docker run -d --name aistor \
            -p 9000:9000 \
            -v /tmp/certs-dir:/certs \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_CI_CD=true \
            -e MINIO_KMS_SECRET_KEY="${MINIO_KMS_SECRET_KEY}" \
            -e MINIO_LICENSE="${MINIO_LICENSE}" \
            quay.io/minio/aistor/minio:edge-daily \
            server --quiet --certs-dir /certs /data/{1...4}
          ready=false
          for _ in $(seq 1 60); do
            if curl -sf --cacert /tmp/certs-dir/public.crt https://localhost:9000/minio/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs aistor
            echo "AIStor server did not become ready within 60 seconds" >&2
            exit 1
          fi
          make test functional-test

  # Preserve the existing required-check name and require both parallel jobs.
  build:
    name: Test on Go 1.27.2 and ubuntu-latest
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, examples, race and functional tests
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$INTEGRATION_RESULT" = success
